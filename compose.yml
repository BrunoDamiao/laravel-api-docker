services:

  # ------------------------------------------------------------
  # Aplicação Laravel (PHP-FPM)
  # ------------------------------------------------------------
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    environment:
      - PHP_IDE_CONFIG=serverName=laravel
    networks:
      - laravel_net
    depends_on:
      - db

  # ------------------------------------------------------------
  # Servidor Web (Nginx)
  # ------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_net
    depends_on:
      - app

  # ------------------------------------------------------------
  # Banco de Dados (MySQL)
  # ------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - laravel_net

  # ------------------------------------------------------------
  # Redis (cache, sessions, filas)
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - laravel_net

  # ------------------------------------------------------------
  # Adminer - GUI pra ver o banco no navegador
  # ------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: laravel_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - laravel_net
    depends_on:
      - db

  # ------------------------------------------------------------
  # Mailhog - captura e-mails enviados pela aplicação (não envia de verdade)
  # ------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: laravel_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # porta SMTP usada pelo Laravel (MAIL_HOST)
      - "8025:8025"  # interface web pra ver os e-mails
    networks:
      - laravel_net

networks:
  laravel_net:
    driver: bridge

volumes:
  db_data:
    driver: local
